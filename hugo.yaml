baseURL: "https://nobe0716.github.io/"
languageCode: "ko-kr"
title: "Sunghyo Jung's Tech Blog"
theme: "PaperMod"

# Permalinks structure
permalinks:
  posts: /posts/:slug/

# Pagination
paginate: 10

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Menu
menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

params:
  env: production
  title: "Sunghyo Jung"
  description: "백엔드 개발, 엔지니어링 운영, 내부 도구, AI 활용 경험을 기록하는 기술 블로그"
  keywords: [Backend, Engineering, Internal Tools, AI Agent, Retrospective, Ownership Cost]
  author: "Sunghyo Jung"
  images: ["/images/papermod-cover.png"] # Fallback OG image

  # Theme Appearance
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  # Home Page
  homeInfoParams:
    Title: "반갑습니다. Sunghyo Jung입니다."
    Content: "제품 개발과 엔지니어링 운영 사이에서 마주치는 실행 비용, ownership cost, 내부 도구, AI 활용 경험을 기록합니다."

  # Social Icons
  socialIcons:
    - name: github
      url: "https://github.com/nobe0716"
    - name: linkedin
      url: "https://www.linkedin.com/in/sunghyo-jung/" # Assuming based on name
    - name: email
      url: "mailto:nobe0716@gmail.com"

  # Analytics & SEO
  # googleAnalyticsID: "G-XXXXXXXXXX" # User can add later

  # PaperMod specific
  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

  editPost:
    URL: "https://github.com/nobe0716/nobe0716.github.io/tree/main/content"
    Text: "수정 제안하기"
    appendFilePath: true

# SEO / robots.txt
enableRobotsTXT: true

# Markdown / Goldmark
markup:
  goldmark:
    renderer:
      unsafe: true # To support raw HTML if needed
  highlight:
    style: monokai
    noClasses: false
